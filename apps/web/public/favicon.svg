<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Ticket glyph from the lucide set, matching the icons used in the app. Same
    drawing as <LogoMark /> in src/components/layout/Logo.tsx, so the tab and
    the sidebar read as one identity.

    The colours are duplicated here as literals rather than shared with the app:
    a favicon is fetched as a standalone document and cannot see the page's CSS
    variables, so --sidebar-primary is unavailable. These are the same two
    emerald steps those tokens resolve to (light 0.596L = emerald-600, dark
    0.696L = emerald-500) — change them together or the tab drifts from the app.

    Inverts with the browser/OS theme, not the app's own toggle: nothing can
    reach across into a tab strip.
  -->
  <style>
    .plate { fill: #059669; }
    .mark { stroke: #ecfdf5; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #10b981; }
      .mark { stroke: #022c22; }
    }
  </style>
  <rect class="plate" width="24" height="24" rx="5" />
  <g
    class="mark"
    fill="none"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(3.6 3.6) scale(0.7)"
  >
    <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
    <path d="M13 5v2" />
    <path d="M13 11v2" />
    <path d="M13 17v2" />
  </g>
</svg>
