<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    Ticket glyph from the lucide set, matching the icons used in the app.
    Inverts with the browser/OS theme so the mark stays legible on both a
    light and a dark tab strip.
  -->
  <style>
    .plate { fill: #0a0a0a; }
    .mark { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #fafafa; }
      .mark { stroke: #0a0a0a; }
    }
  </style>
  <rect class="plate" width="24" height="24" rx="5" />
  <g
    class="mark"
    fill="none"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
    transform="translate(3.6 3.6) scale(0.7)"
  >
    <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z" />
    <path d="M13 5v2" />
    <path d="M13 11v2" />
    <path d="M13 17v2" />
  </g>
</svg>
