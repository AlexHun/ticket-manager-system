<!doctype html>
<!-- `class="dark"` is permanent and load-bearing, not a default. The app has one
     theme; the class is what keeps `@custom-variant dark (&:is(.dark *))`
     matching, and roughly 28 shadcn components carry `dark:` utilities that
     silently stop applying without it. See the palette block in index.css. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Without an explicit icon link the browser auto-requests /favicon.ico,
         which nothing serves -> 404 in the console on every page load. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Ticket Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
