# Verification only — this workflow does not deploy.
#
# Railway owns the deploy: each service's `railway.json` decides what rebuilds
# (`watchPatterns`), the API applies migrations as its pre-deploy command, and a
# healthcheck gates the switchover. Reimplementing any of that here would give
# the project two answers to "is this change deployable", and they would
# disagree on exactly the day it mattered. This is the gate in front of it.
name: CI

on:
  # `develop` is the integration branch every ticket merges into; a push there
  # is checked so a release PR into `main` starts from a known-green tip.
  push:
    branches: [main, develop]
  pull_request:

# A superseded push has nothing to tell us. Never cancel on main, where the run
# is the record of what was deployed. A cancelled run on develop never reaches
# `bump-version`, which is why that job reads every commit since the last bump
# rather than only the merge that triggered it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.13

jobs:
  check:
    name: Typecheck, unit tests, web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # --frozen-lockfile is what the Dockerfiles use. A lockfile that only
      # resolves when Bun is allowed to update it is a build that works here and
      # fails in the image.
      - run: bun install --frozen-lockfile

      # The baked PGLite schema the API unit suite runs against (ADR-0014).
      # `src/test/pg.ts` replays this repo's migrations into an in-process
      # Postgres and dumps the finished data directory to
      # `schema-<hash of the migration SQL>.tar` (~40MB); restoring that is
      # ~1.5s against a ~10s replay, and CI paid the replay on every run until
      # this step existed.
      #
      # After `bun install`, not before: the path is inside node_modules,
      # which the install step owns.
      #
      # No `restore-keys`, deliberately. The tar's filename carries the same
      # migration hash as this key, so an inexact restore hands the job a tar
      # it will never open: it bakes the new schema anyway, then saves both
      # under the new key and carries the dead 40MB forward for as long as the
      # key stays warm. A new migration should invalidate this outright.
      - name: Cache the baked PGLite schema
        uses: actions/cache@v4
        with:
          path: apps/api/node_modules/.cache/pglite
          key: pglite-${{ runner.os }}-${{ hashFiles('apps/api/prisma/migrations/**/migration.sql') }}

      # The Prisma client is generated into apps/api/src/generated/prisma, which
      # is gitignored, and there is no postinstall — nothing typechecks until
      # this runs. `prisma generate` loads prisma.config.ts, which reads
      # DATABASE_URL, so it needs *a* value; this one never opens a connection.
      # Same placeholder apps/api/Dockerfile passes for the same reason.
      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bunx --bun prisma generate

      # Prettier is enforced by .husky/pre-commit through lint-staged, which
      # only ever sees staged files — so a `--no-verify`, a web edit, or a
      # merge that reintroduces unformatted code reaches main unnoticed
      # without this. It reads .prettierignore, so the vendored skills under
      # .claude/ and .agents/ (hash-pinned in skills-lock.json) stay untouched.
      - name: Check formatting
        run: bun run format:check

      - name: Typecheck all workspaces
        run: bun run typecheck

      # The provider and the session are mocked; the database is real but runs
      # in process (PGLite, ADR-0014), so this still needs no OPENAI_API_KEY and
      # no Postgres server.
      #
      # Twice, in two file orders that are exact reverses of each other, and
      # both are spelled out rather than left to discovery. `mock.module`'s
      # registry is one process wide and nothing resets it between files, so
      # which file loads first decides which factory a shared specifier binds
      # to; reversing the order swaps every pair at once, and catches what a
      # pair run structurally cannot — a collision whose poisoning file is a
      # *third* one (#158, and the `eval-nightly` → `runner` → `auto-reply`
      # chain #303 found).
      #
      # **Every path starts `./`, and that is load-bearing.** `bun test` reads
      # a bare `src/x.test.ts` as a name *filter* and runs whatever matches in
      # its own discovery order, whatever order the arguments came in; only a
      # path it recognises as one — `./…` — is run where it was listed
      # (measured on Bun 1.3.13, #303). This step used to pass
      # `$(find src … | sort -r)`, bare, so it ran the forward order a second
      # time, green over 75 failures a real reverse order had in it.
      #
      # A sorted list rather than discovery for the forward run too, because
      # discovery is the filesystem's order: NTFS on a dev machine, ext4's hash
      # order here, so no failure it produced could be replayed locally (#202).
      # `LC_ALL=C` so the collation is the same on every machine. The printed
      # list is the order that ran; paste it after `bun test` to reproduce a
      # red one. The flag is passed as well as bunfig.toml's [test] preload —
      # see src/test/preload.ts for why both. ~10s each here (#303, run
      # 35993112770); ~30s on a Windows dev machine.
      - name: API unit tests
        working-directory: apps/api
        run: |
          FILES=$(find ./src -name '*.test.ts' | LC_ALL=C sort)
          echo "$FILES"
          bun test --preload ./src/test/preload.ts $FILES

      - name: API unit tests (reverse file order)
        working-directory: apps/api
        run: |
          FILES=$(find ./src -name '*.test.ts' | LC_ALL=C sort -r)
          echo "$FILES"
          bun test --preload ./src/test/preload.ts $FILES

      - name: Web component tests
        run: bun run --filter '@ticket/web' test

      # VITE_API_URL is baked in at build time and is both the axios baseURL and
      # the CSP's connect-src entry, so a build without one is not the build
      # Railway makes. The value is irrelevant here — only that the bundle and
      # the generated csp.caddy come out of the same run.
      - name: Build web
        working-directory: apps/web
        env:
          VITE_API_URL: https://api.example.com
        run: bun run build

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticket_manager_test
        ports: ["5432:5432"]
        # `-U postgres` is not decoration: bare `pg_isready` connects as the
        # container's OS user, which is root, and there is no such role — so the
        # probe still passes (the server answered) while logging
        # `FATAL: role "root" does not exist` every interval for the life of the
        # job. Dozens of FATALs in the service log of a green run is exactly the
        # noise that makes a real one easy to miss.
        options: >-
          --health-cmd "pg_isready -U postgres -d ticket_manager_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # .env.test is gitignored. The committed example already points at
      # localhost:5432/ticket_manager_test with postgres/postgres — the service
      # container above — and deliberately leaves OPENAI_API_KEY empty with
      # AUTO_REPLY_ENABLED=false, so a CI run spends no money and touches no
      # network.
      #
      # .env.test.ai is the second, AI-enabled API instance's env layer (see
      # playwright.config.ts and tests/e2e/knowledge-auto-reply-approval.spec.ts)
      # — also gitignored, also copied from a committed .example. Without this,
      # dotenv-cli silently loads nothing for the missing file and that second
      # process boots with .env.test's own PORT/OPENAI_API_KEY/AUTO_REPLY_ENABLED,
      # colliding with the ordinary :3002 server instead of running its own.
      - name: Write the test environment
        run: |
          cp apps/api/.env.test.example apps/api/.env.test
          cp apps/api/.env.test.ai.example apps/api/.env.test.ai

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: bunx --bun prisma generate

      # migrate deploy, not reset: nothing here needs wiping, and reset is the
      # command with Prisma 7's consent guard on it.
      - name: Migrate the test database
        run: bun run db:test:migrate

      - run: bunx playwright install --with-deps chromium

      # playwright.config.ts starts its own API (:3002) and web (:4001) from
      # .env.test, and the global setup seeds users idempotently.
      - name: Playwright
        run: bun run test:e2e

      - name: Upload the report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Bumps apps/web's package.json patch version on every push to develop, so the
  # sidebar footer (which reads VITE_SENTRY_RELEASE, itself derived from this
  # version — see releaseName() in apps/web/vite.config.ts) actually changes on
  # each deploy. Without this the version was hand-set once at 0.1.0 and never
  # touched again, and .git is excluded from the Docker build context (see
  # .dockerignore), so there was no commit sha to fall back on either —
  # production showed the same string forever regardless of what shipped.
  #
  # Develop, not main (issue #410). It ran on main until then, and nothing
  # brought its commit back, so develop fell one version further behind on
  # every release and staging's footer never moved between them. A release
  # (develop → main) now carries the version unchanged and main never bumps:
  # the release merge is itself the push Railway rebuilds production from.
  #
  # `[skip ci]` in the commit message is GitHub's own convention: it stops this
  # push from starting another CI run (which would otherwise re-run this job
  # against its own bump commit). Railway is not listening for that convention
  # — it watches pushes to develop directly — so this commit still triggers the
  # staging rebuild that is the point of the job.
  bump-version:
    name: Bump web version
    runs-on: ubuntu-latest
    needs: [check, e2e]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      # Full history, unlike every other checkout here: the changelog step below
      # walks back to the previous bump commit, and checkout's default shallow
      # clone holds only the tip. A shallow walk is the failure issue #113
      # measured (run 33297190858): the range failed to resolve, the fallback
      # read the merge commit's own "Merge pull request #N" subject, and *no
      # merge ever recorded an entry*.
      #
      # `ref` checks out the branch's live tip rather than the commit that
      # triggered this run, so a bump another run pushed since then is already
      # in history and its commits are not recorded a second time.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Bump apps/web patch version
        id: bump
        run: |
          set -euo pipefail
          NEXT=$(node -e "
            const fs = require('fs');
            const path = 'apps/web/package.json';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            pkg.version = \`\${major}.\${minor}.\${patch + 1}\`;
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
            console.log(pkg.version);
          ")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      # The "what's new" changelog (issue #94): one entry per feat/fix commit,
      # generated rather than admin-authored. The range is every commit since
      # the previous bump, oldest first, not only the triggering merge's
      # branch (`HEAD^2 --not HEAD^1`, which is what this read until #410).
      # `cancel-in-progress` is true on develop, so when two PRs merge close
      # together the first run is cancelled before it gets here, and a range
      # of one merge would drop the first PR's entries for good. Stopping
      # cancellation on develop would not close that: a concurrency group keeps
      # one *pending* run and cancels the one it replaces whatever
      # `cancel-in-progress` says, so a third merge still loses the second.
      #
      # Every commit, not just a branch's tip, which is routinely a
      # `refactor`/`docs` review fix-up sitting on top of the `feat` that is
      # the actual point of the branch (issue #113). `--no-merges` drops the
      # "Merge pull request" subjects; a branch's own commits are not
      # reachable from an earlier bump, even one cut before it, so each is
      # read exactly once. With no bump in history at all, `HEAD^1..HEAD` is
      # the triggering merge's branch, or the commit itself for a direct push.
      #
      # The previous bump is the bot's commit whose subject the step below
      # writes. Both filters, which git ANDs: a commit message anywhere that
      # quotes that subject at a line start would otherwise pass for a bump
      # and hide every commit before it.
      - name: Record changelog entries
        env:
          NEXT_VERSION: ${{ steps.bump.outputs.next }}
        run: |
          set -euo pipefail
          LAST_BUMP=$(git log -1 --format=%H --author='^github-actions\[bot\]' --grep='^chore(web): bump version to ' HEAD)
          RANGE="${LAST_BUMP:-HEAD^1}..HEAD"
          echo "Reading $RANGE"
          COMMIT_SUBJECTS=$(git log --reverse --no-merges --format=%s "$RANGE")
          COMMIT_SUBJECTS="$COMMIT_SUBJECTS" node scripts/ci/record-changelog-entry.mjs

      # A merge can land on develop between the checkout above and this push,
      # and a bare `git push` is then rejected outright (observed on main in
      # run 33602886760, from PR #126's merge landing 20s before PR #135's).
      # The commit this job makes only ever touches these two files, so
      # replaying it on top of a newer develop with a rebase is safe; nothing
      # else in this repo writes to either of them.
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json packages/shared/src/changelog-entries.json
          git commit -m "chore(web): bump version to ${{ steps.bump.outputs.next }} [skip ci]"

          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — fetching and rebasing onto the new develop."
            git fetch origin develop
            git rebase origin/develop
          done

          echo "::error::Failed to push the version bump after 5 attempts."
          exit 1
